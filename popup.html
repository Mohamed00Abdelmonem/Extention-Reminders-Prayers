<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salah Reminder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="theme-light">
    <main class="popup-shell">
      <header class="topbar">
        <div>
          <img src="icon.png" alt="Salah Reminder logo" class="brand-logo" />
          <p class="eyebrow" id="salahReminderLabel">Salah Reminder</p>
          <h1 id="cityName">Loading...</h1>
          <p id="currentDate" class="meta-line">Loading date...</p>
        </div>

        <div style="display: flex; gap: 8px;">
          <button id="langToggle" class="theme-toggle" type="button" aria-label="Toggle language">
            <span class="lang-toggle__label">عربي</span>
          </button>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
            <span class="theme-toggle__label">Dark mode</span>
          </button>
        </div>
      </header>

      <section class="hero-card">
        <div class="hero-card__content">
          <p class="hero-card__label" id="nextPrayerLabel">Next Prayer</p>
          <h2 id="nextPrayerName">Loading...</h2>
          <p id="nextPrayerTime" class="hero-card__time">--:--</p>
          <p id="status" class="status">Loading prayer times...</p>
        </div>
      </section>

      <section class="app-section" id="section-prayer">
        <div class="section-header">
          <h3 id="prayerTimesLabel">Prayer Times</h3>
          <p id="loadingHint" class="loading-hint">Fetching latest times...</p>
        </div>
        <div id="prayerTimes" class="prayer-grid" aria-live="polite"></div>
      </section>

      <section class="app-section" id="section-settings">
        <div class="section-header">
          <h3 id="locationSettingsLabel">Location Settings</h3>
          <label class="switch-control">
            <input id="notificationsToggle" type="checkbox" />
            <span id="notificationsLabel">Notifications</span>
          </label>
        </div>

        <form id="locationForm" class="settings-form">
          <label>
            <span id="countryLabel">Country</span>
            <select id="countryInput">
              <option value="Egypt">Egypt</option>
              <option value="Saudi Arabia">Saudi Arabia</option>
              <option value="United Arab Emirates">United Arab Emirates</option>
              <option value="Kuwait">Kuwait</option>
              <option value="Qatar">Qatar</option>
              <option value="Bahrain">Bahrain</option>
              <option value="Oman">Oman</option>
              <option value="Jordan">Jordan</option>
              <option value="Lebanon">Lebanon</option>
              <option value="Syria">Syria</option>
              <option value="Iraq">Iraq</option>
              <option value="Palestine">Palestine</option>
              <option value="Morocco">Morocco</option>
              <option value="Algeria">Algeria</option>
              <option value="Tunisia">Tunisia</option>
              <option value="Libya">Libya</option>
              <option value="Sudan">Sudan</option>
              <option value="Yemen">Yemen</option>
              <option value="United States">United States</option>
              <option value="United Kingdom">United Kingdom</option>
              <option value="Canada">Canada</option>
              <option value="Australia">Australia</option>
              <option value="Germany">Germany</option>
              <option value="France">France</option>
              <option value="Italy">Italy</option>
              <option value="Spain">Spain</option>
              <option value="Turkey">Turkey</option>
              <option value="Malaysia">Malaysia</option>
              <option value="Indonesia">Indonesia</option>
              <option value="Pakistan">Pakistan</option>
              <option value="India">India</option>
              <option value="Bangladesh">Bangladesh</option>
            </select>
          </label>
          <label>
            <span id="cityLabel">City</span>
            <select id="cityInput">
              <option value="Cairo">Cairo</option>
              <option value="Alexandria">Alexandria</option>
              <option value="Giza">Giza</option>
            </select>
          </label>
          <button type="submit" class="primary-button" id="saveLocationBtn">Save Location</button>
        </form>
      </section>

      <section class="app-section" id="section-radio">
        <div class="section-header">
          <h3 id="quranRadioLabel">Quran Radio</h3>
          <p id="radioStatus" class="loading-hint">No station playing</p>
        </div>

        <div class="radio-controls">
          <select id="radioSelect" aria-label="Select Quran radio station">
            <option value="">Loading stations...</option>
          </select>
          <div class="button-row">
            <button id="radioPlay" type="button" class="primary-button">Play</button>
            <button id="radioStop" type="button" class="secondary-button">Stop</button>
          </div>
        </div>
      </section>

      <section class="app-section" id="section-azkar">
        <div class="section-header">
          <h3 id="azkarLabel">Azkar</h3>
          <div class="segmented-control" role="group" aria-label="Azkar type">
            <button id="morningAzkarTab" type="button" class="segment-button segment-button--active">Morning</button>
            <button id="eveningAzkarTab" type="button" class="segment-button">Evening</button>
          </div>
        </div>

        <div id="azkarList" class="azkar-list" aria-live="polite"></div>
      </section>

      <nav class="bottom-nav">
        <a href="#section-prayer" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span id="navPrayerLabel">Prayer</span>
        </a>
        <a href="#section-azkar" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span id="navAzkarLabel">Azkar</span>
        </a>
        <a href="#section-radio" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48 0a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path></svg>
          <span id="navRadioLabel">Radio</span>
        </a>
        <a href="#section-settings" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span id="navSettingsLabel">Settings</span>
        </a>
      </nav>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
